<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* Layout: app shell mirroring the real Gharas dashboard — role bar on top, sidebar + main, guided-tour panel. */
:root {
  --bg: #f4f7f4;
  --surface: #ffffff;
  --surface-2: #f0f5f1;
  --fg: #1d2b25;
  --muted: #64746c;
  --line: #dfe8e2;
  --green: #1b6b50;
  --green-strong: #0f3d2e;
  --green-soft: #e3f2eb;
  --gold: #b8913c;
  --gold-soft: #f6eedb;
  --danger: #b4403b;
  --danger-soft: #fbe9e8;
  --warn: #9a6a00;
  --warn-soft: #fdf3d9;
  --info: #2a6aa8;
  --info-soft: #e6f0fa;
  --side-bg: #0f3d2e;
  --side-fg: #e3efe9;
  --side-muted: rgba(227,239,233,.55);
  --shadow: 0 1px 2px rgba(15,61,46,.06), 0 4px 14px rgba(15,61,46,.05);
  --font: 'Cairo', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1613; --surface: #15211c; --surface-2: #1b2a23; --fg: #e4eee9; --muted: #95a89f; --line: #26372f;
    --green: #4cbf92; --green-strong: #8fe0bf; --green-soft: #183a2d; --gold: #d8b468; --gold-soft: #3a3020;
    --danger: #ec8a84; --danger-soft: #3b1f1e; --warn: #e6bd5c; --warn-soft: #3a2f16; --info: #7fb4ea; --info-soft: #1a2c3e;
    --side-bg: #0a1210; --side-fg: #dbe9e2; --side-muted: rgba(219,233,226,.5); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1613; --surface: #15211c; --surface-2: #1b2a23; --fg: #e4eee9; --muted: #95a89f; --line: #26372f;
  --green: #4cbf92; --green-strong: #8fe0bf; --green-soft: #183a2d; --gold: #d8b468; --gold-soft: #3a3020;
  --danger: #ec8a84; --danger-soft: #3b1f1e; --warn: #e6bd5c; --warn-soft: #3a2f16; --info: #7fb4ea; --info-soft: #1a2c3e;
  --side-bg: #0a1210; --side-fg: #dbe9e2; --side-muted: rgba(219,233,226,.5); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
.app { direction: rtl; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; max-width: 1400px; margin: 0 auto; display: grid; gap: 14px; }

/* Role bar */
.rolebar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--side-bg); color: var(--side-fg); border-radius: var(--radius); padding: 10px 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #c9a24a, #e6cd88); color: #0f3d2e; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.brand b { display: block; font-size: 16px; line-height: 1.2; }
.brand-mark img { width: 100%; height: 100%; object-fit: contain; border-radius: inherit; background: #fff; padding: 2px; }
.logo-box { width: 112px; height: 112px; border: 1px dashed var(--border); border-radius: 16px; display: grid; place-items: center; }
.logo-box .brand-mark { width: 88px; height: 88px; font-size: 40px; border-radius: 20px; }
.brand small { color: var(--side-muted); font-size: 11px; }
.sim-tag { background: rgba(201,162,74,.22); color: #f1d999; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; letter-spacing: .02em; }
.roles { display: flex; gap: 4px; background: rgba(255,255,255,.07); padding: 4px; border-radius: 10px; margin-inline-start: auto; flex-wrap: wrap; }
.roles button { border: 0; background: transparent; color: var(--side-fg); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.roles button[aria-pressed="true"] { background: #c9a24a; color: #0f3d2e; }
.roles button:focus-visible, .btn:focus-visible, .nav button:focus-visible { outline: 2px solid #c9a24a; outline-offset: 2px; }
.reset { border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--side-fg); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; }

/* Shell */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr) 280px; gap: 14px; align-items: start; }
.nav { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; display: grid; gap: 2px; position: sticky; top: env(safe-area-inset-top, 0px); }
.nav .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.nav .who b { display: block; font-size: 14px; }
.nav .who small { color: var(--muted); font-size: 12px; }
.nav button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: start; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--fg); font-size: 14px; }
.nav button:hover { background: var(--surface-2); }
.nav button.active { background: var(--green-soft); color: var(--green-strong); font-weight: 700; }
.nav .ico { width: 20px; text-align: center; opacity: .85; }
.nav .count { margin-inline-start: auto; background: var(--danger); color: #fff; font-size: 11px; border-radius: 99px; padding: 0 7px; font-weight: 700; }
main { min-width: 0; display: grid; gap: 14px; }

.tour { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; position: sticky; top: env(safe-area-inset-top, 0px); }
.tour h2 { font-size: 15px; margin-bottom: 4px; }
.tour p { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.tour ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.tour li { counter-increment: s; display: grid; grid-template-columns: 24px 1fr; gap: 8px; font-size: 13px; align-items: start; }
.tour li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.tour li.done::before { content: "✓"; background: var(--green); color: #fff; }
.tour li.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.tour .bar { height: 6px; background: var(--surface-2); border-radius: 6px; margin: 4px 0 12px; overflow: hidden; }
.tour .bar i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .3s; }

/* Page content */
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.page-head h1 { font-size: 21px; font-weight: 800; }
.crumb { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-h { padding: 11px 14px; border-bottom: 1px solid var(--line); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-b { padding: 14px; }
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat { display: flex; gap: 12px; align-items: center; padding: 14px; }
.stat .si { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: var(--green-soft); color: var(--green); flex-shrink: 0; }
.stat.gold .si { background: var(--gold-soft); color: var(--gold); }
.stat.blue .si { background: var(--info-soft); color: var(--info); }
.stat.red .si { background: var(--danger-soft); color: var(--danger); }
.stat b { font-size: 24px; font-weight: 800; line-height: 1.1; display: block; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12.5px; }

.btn { border: 1px solid var(--green); background: var(--green); color: #fff; border-radius: 9px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
:root[data-theme="dark"] .btn { color: #0e1613; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0e1613; } }
.btn.ghost { background: transparent; color: var(--green); }
.btn.gold { background: var(--gold); border-color: var(--gold); }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { background: var(--surface-2); color: var(--green-strong); font-weight: 700; text-align: start; padding: 9px 12px; white-space: nowrap; font-size: 13px; }
td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 99px; white-space: nowrap; }
.p-green { background: var(--green-soft); color: var(--green); }
.p-red { background: var(--danger-soft); color: var(--danger); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-info { background: var(--info-soft); color: var(--info); }
.p-gray { background: var(--surface-2); color: var(--muted); }
.p-gold { background: var(--gold-soft); color: var(--gold); }

.meter { height: 8px; background: var(--surface-2); border-radius: 8px; overflow: hidden; flex: 1; min-width: 60px; }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 8px; }
.meter.full i { background: var(--danger); }

label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0; }
label.f span.req::after { content: " *"; color: var(--danger); }
input.i, select.i, textarea.i { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; font-weight: 400; min-width: 0; }
input.i:focus, select.i:focus, textarea.i:focus { outline: 2px solid var(--green); outline-offset: -1px; }
.i.bad { border-color: var(--danger); }
.err { color: var(--danger); font-size: 12px; font-weight: 600; }
.hint { color: var(--muted); font-size: 12px; font-weight: 400; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-size: 13px; border-inline-start: 1px solid var(--line); }
.seg button:first-child { border-inline-start: 0; }
.seg button[aria-pressed="true"][data-v="present"] { background: var(--green); color: #fff; }
.seg button[aria-pressed="true"][data-v="late"] { background: var(--warn); color: #fff; }
.seg button[aria-pressed="true"][data-v="absent"] { background: var(--danger); color: #fff; }
.seg button[aria-pressed="true"][data-v="excused"] { background: var(--info); color: #fff; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 600; }
.tabs button.on { color: var(--green-strong); border-bottom-color: var(--gold); }

.empty { text-align: center; color: var(--muted); padding: 26px 10px; font-size: 14px; }
.denied { text-align: center; padding: 34px 16px; }
.denied b { font-size: 46px; color: var(--danger); display: block; line-height: 1; }
.alert { padding: 10px 12px; border-radius: 10px; font-size: 13.5px; }
.alert.info { background: var(--info-soft); color: var(--info); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.ok { background: var(--green-soft); color: var(--green-strong); }

.notif { display: grid; grid-template-columns: 32px 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.notif:first-child { border-top: 0; }
.notif .ni { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); font-size: 15px; }
.notif.new b::after { content: "جديد"; margin-inline-start: 6px; font-size: 10.5px; background: var(--danger); color: #fff; border-radius: 99px; padding: 0 6px; }

.surah-row { display: grid; grid-template-columns: 80px 1fr 110px; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }

.chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
.chart .col { flex: 1; display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; min-width: 0; }
.chart .col i { width: 100%; max-width: 26px; background: var(--green); border-radius: 5px 5px 0 0; display: block; }
.chart .col.today i { background: var(--gold); }
.chart .col span { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Modal + toast */
.modal-bg { position: fixed; inset: 0; background: rgba(8,20,15,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; max-width: 420px; width: 100%; padding: 20px; direction: rtl; display: grid; gap: 12px; border: 1px solid var(--line); }
.modal h3 { font-size: 17px; }
.toast-wrap { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); z-index: 60; display: grid; gap: 8px; direction: rtl; }
.reminder { direction: rtl; text-align: right; position: fixed; bottom: 16px; left: 16px; z-index: 60; width: min(360px, calc(100vw - 32px)); background: #fffdf7; border: 1px solid #e2dccb; border-inline-start: 5px solid var(--gold); border-radius: 14px; box-shadow: 0 10px 30px rgba(15,61,46,.18); padding: 12px 14px; animation: tin .35s ease; }
.reminder .rh { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #9a7a2e; }
.reminder .rh button { margin-inline-start: auto; border: 0; background: none; cursor: pointer; font-size: 16px; color: #7a867f; }
.reminder .rt { font-size: 16.5px; line-height: 1.9; color: #0f3d2e; font-weight: 700; margin-top: 2px; }
.reminder .rs { font-size: 12px; color: #7a867f; }
.warnbar { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-inline-start: 5px solid var(--danger); border-radius: 12px; padding: 12px 14px; }
.toast { background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--green); padding: 10px 14px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.12); font-size: 14px; max-width: 320px; animation: tin .25s ease; }
.toast.error { border-inline-start-color: var(--danger); }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .tour .bar i { transition: none; } }

@media (max-width: 1100px) {
  .shell { grid-template-columns: 200px minmax(0, 1fr); }
  .tour { grid-column: 1 / -1; position: static; order: -1; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .nav { position: static; display: flex; overflow-x: auto; gap: 4px; }
  .nav .who { display: none; }
  .nav button { width: auto; white-space: nowrap; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3, .g2 { grid-template-columns: minmax(0, 1fr); }
  .roles { margin-inline-start: 0; width: 100%; }
  .roles button { flex: 1; }
  .surah-row { grid-template-columns: 70px 1fr 90px; }
}
.no-dl [data-dlweek]{display:none!important}
.reminder.at-top { bottom: auto; top: 16px; }
.perm-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line, #e6e3d8); }
.perm-row:last-child { border-bottom: 0; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
.swatch[aria-pressed="true"] { border-color: var(--gold, #c9a24a); }
.daybtn[aria-pressed="true"] { background: var(--green); color: #fff; }
</style>

<div class="app" id="app" dir="rtl" lang="ar">
  <header class="rolebar">
    <div class="brand"><span class="brand-mark" id="bmark">غ</span><div><b id="btitle-v">مركز غراس</b><small id="bsub-v">لتحفيظ القرآن الكريم</small></div></div>
    <span class="sim-tag">محاكاة ببيانات تجريبية</span>
    <div class="roles" role="group" aria-label="اختر الدور">
      <button type="button" data-role="super">المدير الأعلى</button>
      <button type="button" data-role="admin">مدير النظام</button>
      <button type="button" data-role="teacher">المحفظ</button>
      <button type="button" data-role="parent">ولي الأمر</button>
      <button type="button" data-role="visitor">زائر / داعم</button>
    </div>
    <button type="button" class="reset" id="loginbtn">🔑 شاشة الدخول</button>
    <button type="button" class="reset" id="reset">إعادة ضبط المحاكاة</button>
  </header>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="القائمة"></nav>
    <main id="main"></main>
    <aside class="tour" id="tour"></aside>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>
<div id="modal-root"></div>

    S.records.push(r);
    var s = student(v.sid);
    if (v.shared) notify('p' + s.parentId, '📖', 'تسميع جديد', s.name + ': ' + TYPES[r.type][0] + ' - ' + SURAH[r.surah].name + ' (' + r.from + '-' + r.to + ') - ' + grade(r.score)[0], { child: s.id, tab: 'mem' });
    log('تسجيل ' + TYPES[r.type][0] + ' للطالب ' + s.name + ' (' + SURAH[r.surah].name + ')');
    if (v.sid === 1) done('t-memo');
    save(); ui.errors = {}; toast('تم حفظ سجل التسميع' + (r.type === 'new' && r.score < PASS ? '. الدرجة أقل من ' + PASS + ' فلا تُحتسب الآيات محفوظة بعد.' : '.')); go('dash');
  }
  function submitAssess(ev) {
    ev.preventDefault();
    var vals = [], e = {};
    document.querySelectorAll('[data-crit]').forEach(function (i) { var k = +i.dataset.crit; vals[k] = i.value; if (i.value === '') e['c' + k] = 'مطلوب.'; else if (+i.value > CRITERIA[k][1] || +i.value < 0) e['c' + k] = 'بين 0 و ' + CRITERIA[k][1] + '.'; });
    if (Object.keys(e).length) { e._v = vals; ui.errors = e; ui.param = +$('as').value; render(); toast('يرجى تصحيح الدرجات.', 'error'); return; }
    var sid = +$('as').value, scores = vals.map(Number), pct = scores.reduce(function (a, b) { return a + b; }, 0);
    S.assessments.push({ id: ++S.seq, sid: sid, date: TODAY, scores: scores, pct: pct, notes: $('an2').value, shared: true });
    var s = student(sid); notify('p' + s.parentId, '🏅', 'تقييم جديد', 'تقييم ' + s.name + ': ' + pct + '% (' + grade(pct)[0] + ')', { child: sid, tab: 'ass' });
    log('تقييم الطالب ' + s.name + ' بنسبة ' + pct + '%'); save(); ui.errors = {}; toast('تم حفظ التقييم.'); go('dash');
  }
  function submitMsg(ev) {
    ev.preventDefault(); var body = $('mbody').value.trim(), subject = $('msub').value.trim() || 'رسالة', isT = ui.role === 'teacher', sid, to;
    if (isT) { sid = +$('msid').value; if (!sid) { toast('اختر ولي الأمر أولاً.', 'error'); return; } to = 'p' + student(sid).parentId; }
    else { sid = +$('msid').value; to = 't' + circle(student(sid).circleId).teacherId; }
    if (!body) { toast('اكتب نص الرسالة أولاً.', 'error'); return; }
    var me = myCode();
    S.messages.push({ id: ++S.seq, from: me, to: to, sid: sid, subject: subject, body: body, at: 'الآن', read: false });
    if (to[0] === 'p') notify(to, '✉️', 'رسالة جديدة', 'من ' + nameOf(me) + ': ' + subject, { view: 'inbox' });
    log('إرسال رسالة إلى ' + nameOf(to));
    if (isT) done('t-msg'); else if (S.messages.some(function (m) { return m.to === me && m.from[0] === 't'; })) done('p-msg');
    save(); toast('تم إرسال الرسالة إلى ' + nameOf(to) + '.' + (isT && to !== meP() ? ' (لترى الرسالة: ادخل من «شاشة الدخول» برقم جوال ولي الأمر ' + parent(+to.slice(1)).phone + ')' : '')); ui.param = null; render();
  }
  function setLogo(file) {
    if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type)) { toast('اختر صورة PNG أو JPG أو WEBP.', 'error'); return; }
    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var size = 160, c = document.createElement('canvas'), k = Math.min(size / img.width, size / img.height);
        c.width = size; c.height = size; var w = img.width * k, hh = img.height * k;
        c.getContext('2d').drawImage(img, (size - w) / 2, (size - hh) / 2, w, hh);
        S.logo = c.toDataURL('image/png'); log('تغيير شعار المركز'); done('a-logo'); save(); render(); toast('تم تغيير الشعار.');
      };
      img.onerror = function () { toast('تعذّرت قراءة الصورة.', 'error'); };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

  // ---------------------------------------------------------------- events
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, tr[data-go]'); if (!t) return;
    if (t.dataset.role) { if (t.closest('#modal-root')) return; var rk = t.dataset.role; ui.sup = rk === 'super'; ui.role = ui.sup ? 'admin' : rk; if (rk === 'admin' && ME.admin === 1) ME.admin = 2; if (ui.sup) ME.admin = 1; ui.attDraft = null; go('dash'); return; }
    if (t.dataset.color) { S.brand.color = t.dataset.color; save(); render(); toast('تم تغيير اللون الرئيسي.'); return; }
    if (t.dataset.remday) { var dd = S.reminders.days, dn = +t.dataset.remday; if (dd.indexOf(dn) >= 0) dd.splice(dd.indexOf(dn), 1); else dd.push(dn); save(); render(); return; }
    if (t.id === 'loginbtn') { loginBox(); return; }
    if (t.dataset.page) { ui.page = +t.dataset.page; render(); return; }
    if (t.id === 'reset') { confirmBox('إعادة ضبط المحاكاة', 'ستعود جميع البيانات والجولة إلى البداية.', 'إعادة الضبط', function () { S = seed(); save(); ui.attDraft = null; ME = { admin: 1, teacher: 1, parent: 1, visitor: 1 }; go('dash'); toast('تمت إعادة الضبط.'); }); return; }
    if (t.dataset.go) { if (t.dataset.go === 'att') ui.attDraft = null; go(t.dataset.go, t.dataset.p ? +t.dataset.p : null); return; }
    if (t.dataset.tab) { ui.tab = t.dataset.tab; render(); return; }
    if (t.dataset.status) { doStatus(t.dataset.status); return; }
    if (t.dataset.sid) { ui.attDraft[t.dataset.sid] = t.dataset.v; render(); return; }
    if (t.id === 'allp' || t.id === 'alla') { Object.keys(ui.attDraft).forEach(function (k) { ui.attDraft[k] = t.id === 'allp' ? 'present' : 'absent'; }); render(); return; }
    if (t.id === 'saveatt') { saveAttendance(); return; }
    if (t.id === 'rmlogo') { S.logo = null; log('استعادة الشعار الافتراضي'); save(); render(); toast('تمت العودة إلى الشعار الافتراضي.'); return; }
    if (t.id === 'dotransfer') { doTransfer(); return; }
    if (t.dataset.tedit) { teacherEditStudent(+t.dataset.tedit); return; }
    if (t.dataset.week) { ui.week = t.dataset.week; render(); return; }
    if (t.dataset.dlweek) { var pw = t.dataset.dlweek.split('|'); downloadWeek(+pw[0], pw[1]); return; }
    if (t.dataset.chteacher) { changeTeacher(+t.dataset.chteacher); return; }
    if (t.dataset.chtime) { changeTime(+t.dataset.chtime); return; }
    if (t.dataset.warn) { warnTeacher(+t.dataset.warn, t.dataset.wc ? +t.dataset.wc : null); return; }
    if (t.dataset.tnew) { teacherForm(null); return; }
    if (t.dataset.tedit) { teacherForm(teacher(+t.dataset.tedit)); return; }
    if (t.dataset.tdel) { deleteTeacher(+t.dataset.tdel); return; }
    if (t.dataset.ttoggle) { var tt = teacher(+t.dataset.ttoggle); tt.status = tt.status === 'active' ? 'suspended' : 'active'; log((tt.status === 'active' ? 'تفعيل' : 'إيقاف') + ' حساب ' + tt.name); save(); render(); toast(tt.status === 'active' ? 'تم تفعيل الحساب.' : 'تم إيقاف الحساب: لن يتمكن من الدخول.'); return; }
    if (t.dataset.moveall) { moveAll(+t.dataset.moveall); return; }
    if (t.dataset.ack) { var w = S.warnings.find(function (x) { return x.id === +t.dataset.ack; }); w.ack = 'الآن'; log('اطلع المحفظ على ' + WLEVELS[w.level][0]); save(); render(); toast('شكراً، تم تسجيل اطلاعك. يظهر ذلك للمدير.'); return; }
    if (t.id === 'remnow') { remLast = Date.now(); showReminder(); return; }
    if (t.id === 'remon') { S.reminders.on = !S.reminders.on; save(); render(); toast(S.reminders.on ? 'تم تفعيل التذكير.' : 'تم إيقاف التذكير.'); return; }
    if (t.id === 'readall') { S.notifications.forEach(function (n) { if (n.to === meP()) n.read = true; }); save(); render(); return; }
    if (t.dataset.openNotif) {
      var n = S.notifications.find(function (x) { return x.id === +t.dataset.openNotif; }); n.read = true;
      if (n.title === 'تنبيه غياب') done('p-absent');
      save(); if (n.link.view) { go(n.link.view); return; } ui.tab = n.link.tab; ui.view = 'child'; ui.param = n.link.child; render(); return;
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.matches('tr[data-go]')) ev.target.click();
    if (ev.key === 'Escape' && $('mbg')) $('modal-root').innerHTML = '';
  });

  render();
})();
</script>
