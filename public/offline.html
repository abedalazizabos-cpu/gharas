<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لا يوجد اتصال بالإنترنت</title>
<style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Tahoma, Arial, sans-serif; background: #0f3d2e; color: #fff; text-align: center; padding: 1.5rem; box-sizing: border-box; }
    .box { max-width: 360px; }
    h1 { font-size: 1.3rem; margin: .8rem 0 .4rem; }
    p { opacity: .85; line-height: 1.8; }
    button { margin-top: 1rem; background: #c9a24a; color: #fff; border: 0; border-radius: 10px; padding: .7rem 1.6rem; font-size: 1rem; cursor: pointer; }
    .icon { font-size: 3rem; }
</style>
</head>
<body>
<div class="box">
    <div class="icon">📶</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من الاتصال ثم أعد المحاولة. بيانات المركز تُعرض دائماً من الموقع مباشرة لتكون محدّثة.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
</div>
</body>
</html>
